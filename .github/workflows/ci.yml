name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Mesmas versões usadas no deploy (Lambda/Docker)
          pip install -r requirements-deploy.txt
          # Dependências só de teste
          # httpx < 0.28: o TestClient do FastAPI 0.109 ainda passa app= ao
          # httpx, argumento removido no httpx 0.28+ (quebraria a coleta).
          pip install pytest "httpx<0.28"

      - name: Rodar testes
        run: pytest
